# ============================================================================
# blackbox.conf — System Blackbox Configuration File
# ============================================================================
# Used by both the C++ engine (system_blackbox) and the web server (server.py).
#
# To store data in MySQL / MariaDB (Default):
#   1. Make sure MariaDB is running: sudo systemctl start mariadb
#   2. Run the one-time setup:       sudo mariadb < sql/setup.sql
#
# If MySQL is not reachable, the C++ engine will automatically fall back
# to SQLite (blackbox.db) so your system monitoring never stops!
# ============================================================================

# Database backend: "mysql" or "sqlite"
db_backend = mysql

# MySQL / MariaDB connection settings
mysql_host = 127.0.0.1
mysql_port = 3306
mysql_user = blackbox_writer
mysql_password = writer_pass
mysql_database = blackbox
mysql_socket = /run/mysqld/mysqld.sock

# MySQL reader credentials (used by server.py web dashboard)
mysql_reader_user = blackbox_reader
mysql_reader_password = reader_pass

# SQLite database file path (used if db_backend = sqlite or as fallback)
sqlite_path = blackbox.db

# Monitoring intervals and retention
interval = 1.0
retention_days = 7

# Alert thresholds (0 = disabled)
cpu_alert = 90.0
ram_alert = 90.0
temp_alert = 85.0

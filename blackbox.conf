# config options shared between the c++ daemon and python web dashboard

# choose primary database engine: "mysql" or "sqlite"
db_backend = mysql

# mysql/mariadb connection settings for writer daemon
mysql_host = 127.0.0.1
mysql_port = 3306
mysql_user = blackbox_writer
mysql_password = writer_pass
mysql_database = blackbox
mysql_socket = /run/mysqld/mysqld.sock

# read-only credentials used by server.py dashboard
mysql_reader_user = blackbox_reader
mysql_reader_password = reader_pass

# local sqlite file used if db_backend = sqlite or when mysql is unreachable
sqlite_path = blackbox.db

# sensor polling frequency in seconds and data retention window in days
interval = 1.0
retention_days = 7

# threshold limits before triggering an alert (0 disables)
cpu_alert = 90.0
ram_alert = 90.0
temp_alert = 85.0
